<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Repair - MS Mobiles</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        /* NAVBAR */
        .navbar {
            background: #0b1f3a;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #64b5f6;
        }

        /* PAGE */
        .container {
            width: 90%;
            max-width: 850px;
            margin: 45px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            color: #0b1f3a;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .title p {
            color: #666;
        }

        /* MESSAGES */
        .message {
            padding: 14px 18px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        /* FORM CARD */
        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dbe3;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #1976d2;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .required {
            color: red;
        }

        /* BUTTON */
        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #1976d2;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #125ca5;
        }

        /* FOOTER */
        footer {
            margin-top: 50px;
            background: #0b1f3a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .form-card {
                padding: 22px;
            }

            .title h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="logo">
        📱 MS Mobiles
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/book-repair/">Book Repair</a>
        <a href="/repair-track/">Track Repair</a>
    </div>

</nav>


<!-- MAIN -->
<div class="container">

    <div class="title">

        <h1>Book a Repair</h1>

        <p>
            Fill in your mobile repair details and our team will contact you.
        </p>

    </div>


    <!-- DJANGO MESSAGES -->

    {% if messages %}

        {% for message in messages %}

            <div class="message
                {% if message.tags == 'success' %}
                    success
                {% elif message.tags == 'warning' %}
                    warning
                {% else %}
                    error
                {% endif %}
            ">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}


    <!-- FORM -->

    <div class="form-card">

        <form
            method="POST"
            action="{% url 'book_repair' %}"
        >

            {% csrf_token %}


            <!-- CUSTOMER NAME -->

            <div class="form-group">

                <label for="customer_name">
                    Customer Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="customer_name"
                    name="customer_name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                    <span class="required">*</span>
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <!-- DEVICE -->

            <div class="form-group">

                <label for="device">
                    Mobile Brand & Model
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="device"
                    name="device"
                    placeholder="Example: Samsung Galaxy S25"
                    required
                >

            </div>


            <!-- PROBLEM -->

            <div class="form-group">

                <label for="problem">
                    Problem / Service Required
                    <span class="required">*</span>
                </label>

                <select
                    id="problem"
                    name="problem"
                    required
                >

                    <option value="">
                        Select Repair Service
                    </option>

                    <option value="Screen Replacement">
                        Screen Replacement
                    </option>

                    <option value="Battery Replacement">
                        Battery Replacement
                    </option>

                    <option value="Charging Repair">
                        Charging Repair
                    </option>

                    <option value="Speaker & Mic Repair">
                        Speaker & Mic Repair
                    </option>

                    <option value="Software Service">
                        Software Service
                    </option>

                    <option value="Hardware Repair">
                        Hardware Repair
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- VISIT TYPE -->

            <div class="form-group">

                <label for="visit_type">
                    Visit Type
                    <span class="required">*</span>
                </label>

                <select
                    id="visit_type"
                    name="visit_type"
                    required
                >

                    <option value="">
                        Select Visit Type
                    </option>

                    <option value="Shop Visit">
                        Shop Visit
                    </option>

                    <option value="Home Service">
                        Home Service
                    </option>

                </select>

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label for="preferred_date">
                    Preferred Date
                </label>

                <input
                    type="date"
                    id="preferred_date"
                    name="preferred_date"
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Problem Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Please describe the problem with your mobile..."
                ></textarea>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-btn"
            >
                🔧 Book Repair
            </button>

        </form>

    </div>

</div>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 MS Mobiles - Professional Mobile Repair & Service
    </p>

</footer>

</body>
</html>
