<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MS Mobiles - Email Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 500px;
            max-width: 90%;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #0b1f3a;
        }

        h2 {
            color: #333;
        }

        p {
            color: #555;
            margin-bottom: 30px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .success {
            margin-top: 25px;
            padding: 15px;
            background: #d4edda;
            color: #155724;
            border-radius: 8px;
        }

        .error {
            margin-top: 25px;
            padding: 15px;
            background: #f8d7da;
            color: #721c24;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="box">

        <div style="font-size: 55px;">
            📧
        </div>

        <h1>MS Mobiles</h1>

        <h2>Email Notification Test</h2>

        <p>
            Click the button below to test the
            MS Mobiles email notification system.
        </p>

        <form method="POST" action="">
            
            {% csrf_token %}

            <button type="submit">
                📧 Send Test Email
            </button>

        </form>


        {% if success %}

        <div class="success">
            ✅ Test email sent successfully!
            <br><br>
            Please check your Gmail inbox.
        </div>

        {% endif %}


        {% if error %}

        <div class="error">
            ❌ Email could not be sent.
            <br><br>
            {{ error }}
        </div>

        {% endif %}

    </div>

</body>

</html>
