<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MS Mobiles</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: #111827;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        /* Login Section */
        .login-section {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .login-box h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Messages */
        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            background: #fee2e2;
            color: #991b1b;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        /* Register */
        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 14px;
        }

        .register-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* Home Link */
        .home-link {
            text-align: center;
            margin-top: 15px;
        }

        .home-link a {
            color: #374151;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link a:hover {
            color: #2563eb;
        }

        /* Mobile */
        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .login-box {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <a href="{% url 'home' %}" class="logo">
            MS Mobiles
        </a>

        <ul class="nav-links">

            <li>
                <a href="{% url 'home' %}">Home</a>
            </li>

            <li>
                <a href="{% url 'mobiles' %}">Mobiles</a>
            </li>

            <li>
                <a href="{% url 'repair' %}">Repair</a>
            </li>

            <li>
                <a href="{% url 'track_repair' %}">Track Repair</a>
            </li>

        </ul>

    </nav>


    <!-- Login Section -->
    <section class="login-section">

        <div class="login-box">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your MS Mobiles account
            </p>


            <!-- Django Messages -->
            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <!-- Login Form -->
            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <!-- Register Link -->
            <div class="register-text">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Create Account
                </a>

            </div>


            <!-- Home Link -->
            <div class="home-link">

                <a href="{% url 'home' %}">
                    ← Back to Home
                </a>

            </div>

        </div>

    </section>

</body>
</html>
