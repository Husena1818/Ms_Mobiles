<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Order - MS Mobiles</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 30px;
        }

        .mobile-info {
            text-align: center;
            margin-bottom: 25px;
        }

        .mobile-info h2 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .mobile-info p {
            color: #555;
            font-size: 16px;
            margin: 8px 0;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #111827;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📦 Place Your Order</h1>

    <div class="mobile-info">

        <h2>
            {{ mobile.brand }} {{ mobile.model_name }}
        </h2>

        <p>
            RAM: {{ mobile.ram }}
        </p>

        <p>
            Storage: {{ mobile.storage }}
        </p>

        <p class="price">
            ₹{{ mobile.price }}
        </p>

    </div>

    <form method="POST">

        {% csrf_token %}

        <label for="quantity">
            Quantity
        </label>

        <input
            type="number"
            id="quantity"
            name="quantity"
            value="1"
            min="1"
            required
        >

        <button type="submit">
            Place Order
        </button>

    </form>

    <a href="{% url 'mobiles' %}" class="back">
        ← Back to Mobiles
    </a>

</div>

</body>
</html>
